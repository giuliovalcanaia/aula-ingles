<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Aula de Inglês - Exercícios de Daily Routine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .category {
            margin-bottom: 25px;
        }
        .category-title {
            font-size: 1.3rem;
            color: #2980b9;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ecf0f1;
        }
        ul {
            list-style: none;
        }
        li {
            margin-bottom: 12px;
        }
        a {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #34495e;
            background-color: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid #bdc3c7;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        a:hover {
            background-color: #ecf0f1;
            border-left-color: #3498db;
            transform: translateX(4px);
        }
        a:visited {
            color: #34495e;
        }
        .index-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background-color: #3498db;
            color: #fff;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: 700;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .check {
            margin-left: auto;
            font-size: 1.4rem;
            min-width: 28px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        a.opened .check {
            opacity: 1;
            color: #27ae60;
        }
        a.opened {
            border-left-color: #27ae60;
            background-color: #e8f8f5;
        }
        a.opened .index-badge {
            background-color: #27ae60;
        }
        a.locked {
            pointer-events: none;
            opacity: 0.6;
            cursor: not-allowed;
            background-color: #f0f0f0;
            color: #95a5a6;
        }
        a.locked .index-badge {
            background-color: #bdc3c7;
        }
        .lock-icon {
            margin-left: auto;
            font-size: 1.1rem;
            opacity: 0.7;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #ecf0f1;
            border-radius: 20px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-bar {
            height: 20px;
            background-color: #27ae60;
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 20px;
            text-align: center;
            color: white;
            font-size: 0.8rem;
            line-height: 20px;
        }
        .reset-btn {
            display: block;
            margin: 30px auto 0;
            padding: 10px 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .reset-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <script>
        // Cache busting: força recarregar sem cache ao detectar nova versão
        (function() {
            var params = new URLSearchParams(window.location.search);
            if (!params.has('v')) {
                params.set('v', '3');
                window.location.replace(window.location.pathname + '?' + params.toString());
            }
        })();
    </script>
    <div class="container">
        <h1>Aula de Inglês</h1>
        <p class="subtitle">Exercícios de Vocabulary - Daily Routine (Rotina Diária)</p>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <div class="category">
            <div class="category-title">Daily Routine</div>
            <ul id="linkList">
                <li><a href="https://agendaweb.org/exercises/vocabulary/daily-routines/activities-words-pictures-1.htm" target="_blank" data-id="daily-routine-1"><span class="index-badge">1</span> Activities Words & Pictures 1<span class="check">&#10003;</span></a></li>
                <li><a href="https://agendaweb.org/exercises/vocabulary/daily-routines/activities-1-match.htm" target="_blank" data-id="daily-routine-2"><span class="index-badge">2</span> Activities Match 1<span class="check">&#10003;</span></a></li>
                <li><a href="https://agendaweb.org/exercises/vocabulary/daily-routines/activities-quiz-1.htm" target="_blank" data-id="daily-routine-3"><span class="index-badge">3</span> Activities Quiz 1<span class="check">&#10003;</span></a></li>
                <li><a href="https://agendaweb.org/exercises/vocabulary/daily-routines/activities-words-pictures-2.htm" target="_blank" data-id="daily-routine-4"><span class="index-badge">4</span> Activities Words & Pictures 2<span class="check">&#10003;</span></a></li>
                <li><a href="https://agendaweb.org/exercises/vocabulary/daily-routines/activities-2-match.htm" target="_blank" data-id="daily-routine-5"><span class="index-badge">5</span> Activities Match 2<span class="check">&#10003;</span></a></li>
                <li><a href="https://agendaweb.org/exercises/vocabulary/daily" target="_blank" data-id="daily-routine-6"><span class="index-badge">6</span> Daily Routine Extra<span class="check">&#10003;</span></a></li>
            </ul>
        </div>

        <button class="reset-btn" id="resetBtn">Limpar Progresso</button>
    </div>

    <script>
        const STORAGE_KEY = 'aula_ingles_progresso';
        const links = document.querySelectorAll('#linkList a');
        const progressBar = document.getElementById('progressBar');
        const resetBtn = document.getElementById('resetBtn');

        function getOpened() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : {};
            } catch (e) {
                return {};
            }
        }

        function setOpened(id, value) {
            const opened = getOpened();
            opened[id] = value;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(opened));
            updateUI();
        }

        function updateUI() {
            const opened = getOpened();
            let count = 0;

            links.forEach((link, index) => {
                const id = link.getAttribute('data-id');
                const isOpened = !!opened[id];
                const isLocked = index > 0 && !opened[links[index - 1].getAttribute('data-id')];

                if (isOpened) {
                    link.classList.add('opened');
                    count++;
                } else {
                    link.classList.remove('opened');
                }

                if (isLocked) {
                    link.classList.add('locked');
                    link.removeAttribute('href');
                    link.removeAttribute('target');
                    // substitui o check por cadeado se ainda não tiver
                    let lockSpan = link.querySelector('.lock-icon');
                    if (!lockSpan) {
                        const checkSpan = link.querySelector('.check');
                        lockSpan = document.createElement('span');
                        lockSpan.className = 'lock-icon';
                        lockSpan.innerHTML = '&#128274;';
                        if (checkSpan) {
                            checkSpan.replaceWith(lockSpan);
                        } else {
                            link.appendChild(lockSpan);
                        }
                    }
                } else {
                    link.classList.remove('locked');
                    // restaura href e target
                    const originalHref = link.getAttribute('data-href');
                    if (originalHref && !link.getAttribute('href')) {
                        link.setAttribute('href', originalHref);
                        link.setAttribute('target', '_blank');
                    }
                    // restaura check
                    let lockSpan = link.querySelector('.lock-icon');
                    if (lockSpan) {
                        const checkSpan = document.createElement('span');
                        checkSpan.className = 'check';
                        checkSpan.innerHTML = '&#10003;';
                        lockSpan.replaceWith(checkSpan);
                    }
                }
            });

            const total = links.length;
            const percent = total === 0 ? 0 : Math.round((count / total) * 100);
            progressBar.style.width = percent + '%';
            progressBar.textContent = percent + '%';
        }

        // guarda href original antes de qualquer modificação
        links.forEach(link => {
            link.setAttribute('data-href', link.getAttribute('href'));
        });

        links.forEach(link => {
            link.addEventListener('click', function(e) {
                if (link.classList.contains('locked')) {
                    e.preventDefault();
                    return;
                }
                // Se já foi aberto, exige duplo clique para reabrir
                if (link.classList.contains('opened')) {
                    e.preventDefault();
                    return;
                }
                const id = this.getAttribute('data-id');
                setOpened(id, true);
            });

            link.addEventListener('dblclick', function(e) {
                if (link.classList.contains('locked')) {
                    e.preventDefault();
                    return;
                }
                // Só permite duplo clique em links já abertos
                if (link.classList.contains('opened')) {
                    const url = link.getAttribute('data-href');
                    if (url) {
                        window.open(url, '_blank');
                    }
                }
            });
        });

        resetBtn.addEventListener('click', function() {
            if (confirm('Tem certeza que deseja limpar todo o progresso?')) {
                localStorage.removeItem(STORAGE_KEY);
                updateUI();
            }
        });

        // Inicializa
        updateUI();
    </script>
</body>
</html>
