<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Aula de Inglês - Exercícios de Food</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .category {
            margin-bottom: 25px;
        }
        .category-title {
            font-size: 1.3rem;
            color: #2980b9;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ecf0f1;
        }
        ul {
            list-style: none;
        }
        li {
            margin-bottom: 12px;
        }
        a {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #34495e;
            background-color: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid #bdc3c7;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        a:hover {
            background-color: #ecf0f1;
            border-left-color: #3498db;
            transform: translateX(4px);
        }
        a:visited {
            color: #34495e;
        }
        .index-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background-color: #3498db;
            color: #fff;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: 700;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .check {
            margin-left: auto;
            font-size: 1.4rem;
            min-width: 28px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        a.opened .check {
            opacity: 1;
            color: #27ae60;
        }
        a.opened {
            border-left-color: #27ae60;
            background-color: #e8f8f5;
        }
        a.opened .index-badge {
            background-color: #27ae60;
        }
        a.locked {
            pointer-events: none;
            opacity: 0.6;
            cursor: not-allowed;
            background-color: #f0f0f0;
            color: #95a5a6;
        }
        a.locked .index-badge {
            background-color: #bdc3c7;
        }
        .lock-icon {
            margin-left: auto;
            font-size: 1.1rem;
            opacity: 0.7;
        }
        .timer-display {
            margin-left: auto;
            font-size: 0.95rem;
            font-weight: 700;
            color: #e67e22;
            min-width: 28px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
        }
        a.timer-active {
            border-left-color: #e67e22;
            background-color: #fef5e7;
        }
        a.timer-active .index-badge {
            background-color: #e67e22;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #ecf0f1;
            border-radius: 20px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-bar {
            height: 20px;
            background-color: #27ae60;
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 20px;
            text-align: center;
            color: white;
            font-size: 0.8rem;
            line-height: 20px;
        }
        .reset-btn {
            display: block;
            margin: 30px auto 0;
            padding: 10px 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .reset-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Aula de Ingles</h1>
        <p class="subtitle">Exercicios de Vocabulary - Food (Comida)</p>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <div class="category">
            <div class="category-title">Food</div>
            <ul id="linkList">
                <li><a href="https://agendaweb.org/exercises/vocabulary/food/food-drink-words-pictures-1.htm" target="_blank" data-id="food-1"><span class="index-badge">1</span> Food & Drink Words & Pictures 1<span class="check">&#10003;</span></a></li>
                <li><a href="https://agendaweb.org/exercises/vocabulary/food/food-drink-quiz-1.htm" target="_blank" data-id="food-2"><span class="index-badge">2</span> Food & Drink Quiz 1<span class="check">&#10003;</span></a></li>
                <li><a href="https://agendaweb.org/exercises/vocabulary/food/food-1-match.htm" target="_blank" data-id="food-3"><span class="index-badge">3</span> Food Match 1<span class="check">&#10003;</span></a></li>
                <li><a href="https://agendaweb.org/exercises/vocabulary/food/food-1-game.htm" target="_blank" data-id="food-4"><span class="index-badge">4</span> Food Game 1<span class="check">&#10003;</span></a></li>
                <li><a href="https://agendaweb.org/exercises/vocabulary/food/food-drink-write-1.htm" target="_blank" data-id="food-5"><span class="index-badge">5</span> Food & Drink Write 1<span class="check">&#10003;</span></a></li>
                <li><a href="https://agendaweb.org/exercises/vocabulary/food/food-drink-words-pictures-2.htm" target="_blank" data-id="food-6"><span class="index-badge">6</span> Food & Drink Words & Pictures 2<span class="check">&#10003;</span></a></li>
            </ul>
        </div>

        <button class="reset-btn" id="resetBtn">Limpar Progresso</button>
    </div>

    <script>
        const STORAGE_KEY = 'aula_ingles_progresso';
        const TIMERS_KEY = 'aula_ingles_timers';
        const TIMER_DURATION = 3 * 60; // 3 minutos em segundos
        const links = document.querySelectorAll('#linkList a');
        const progressBar = document.getElementById('progressBar');
        const resetBtn = document.getElementById('resetBtn');
        let activeTimers = {}; // id -> intervalId

        function getOpened() {
            try {
                const data = sessionStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : {};
            } catch (e) {
                return {};
            }
        }

        function setOpened(id, value) {
            const opened = getOpened();
            opened[id] = value;
            sessionStorage.setItem(STORAGE_KEY, JSON.stringify(opened));
            updateUI();
        }

        function getTimerData() {
            try {
                const data = sessionStorage.getItem(TIMERS_KEY);
                return data ? JSON.parse(data) : {};
            } catch (e) {
                return {};
            }
        }

        function setTimerData(id, expiryTimestamp) {
            const timers = getTimerData();
            if (expiryTimestamp) {
                timers[id] = expiryTimestamp;
            } else {
                delete timers[id];
            }
            sessionStorage.setItem(TIMERS_KEY, JSON.stringify(timers));
        }

        function clearTimerData(id) {
            const timers = getTimerData();
            delete timers[id];
            sessionStorage.setItem(TIMERS_KEY, JSON.stringify(timers));
        }

        function startTimerUI(id, endTime) {
            if (activeTimers[id]) {
                clearInterval(activeTimers[id]);
            }

            const link = document.querySelector(`a[data-id="${id}"]`);
            if (!link) return;

            link.classList.add('timer-active');

            let timerSpan = link.querySelector('.timer-display');
            if (!timerSpan) {
                const checkSpan = link.querySelector('.check');
                timerSpan = document.createElement('span');
                timerSpan.className = 'timer-display';
                if (checkSpan) {
                    checkSpan.style.display = 'none';
                    link.insertBefore(timerSpan, checkSpan);
                } else {
                    link.appendChild(timerSpan);
                }
            }

            function updateTimer() {
                const now = Date.now();
                const remaining = Math.ceil((endTime - now) / 1000);

                if (remaining <= 0) {
                    timerSpan.textContent = '0:00';
                    return;
                }

                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                timerSpan.textContent = mins + ':' + secs.toString().padStart(2, '0');
            }

            updateTimer();
            activeTimers[id] = setInterval(updateTimer, 1000);
        }

        function completeTimer(id) {
            if (activeTimers[id]) {
                clearInterval(activeTimers[id]);
                delete activeTimers[id];
            }

            const link = document.querySelector(`a[data-id="${id}"]`);
            if (link) {
                link.classList.remove('timer-active');
                const timerSpan = link.querySelector('.timer-display');
                if (timerSpan) {
                    timerSpan.remove();
                }
                const checkSpan = link.querySelector('.check');
                if (checkSpan) {
                    checkSpan.style.display = '';
                }
            }

            clearTimerData(id);
            setOpened(id, true);
        }

        function initTimers() {
            const timers = getTimerData();
            const now = Date.now();

            for (const id in timers) {
                const endTime = timers[id];
                if (now >= endTime) {
                    completeTimer(id);
                } else {
                    startTimerUI(id, endTime);
                    const remaining = endTime - now;
                    setTimeout(function() {
                        completeTimer(id);
                    }, remaining);
                }
            }
        }

        function updateUI() {
            const opened = getOpened();
            let count = 0;

            links.forEach(function(link, index) {
                const id = link.getAttribute('data-id');
                const isOpened = !!opened[id];
                const isLocked = index > 0 && !opened[links[index - 1].getAttribute('data-id')];

                if (isOpened) {
                    link.classList.add('opened');
                    count++;
                } else {
                    link.classList.remove('opened');
                }

                if (isLocked) {
                    link.classList.add('locked');
                    link.removeAttribute('href');
                    link.removeAttribute('target');
                    let lockSpan = link.querySelector('.lock-icon');
                    if (!lockSpan) {
                        const checkSpan = link.querySelector('.check');
                        lockSpan = document.createElement('span');
                        lockSpan.className = 'lock-icon';
                        lockSpan.innerHTML = '&#128274;';
                        if (checkSpan) {
                            checkSpan.replaceWith(lockSpan);
                        } else {
                            link.appendChild(lockSpan);
                        }
                    }
                } else {
                    link.classList.remove('locked');
                    const originalHref = link.getAttribute('data-href');
                    if (originalHref && !link.getAttribute('href')) {
                        link.setAttribute('href', originalHref);
                        link.setAttribute('target', '_blank');
                    }
                    let lockSpan = link.querySelector('.lock-icon');
                    if (lockSpan) {
                        const checkSpan = document.createElement('span');
                        checkSpan.className = 'check';
                        checkSpan.innerHTML = '&#10003;';
                        lockSpan.replaceWith(checkSpan);
                    }
                }
            });

            const total = links.length;
            const percent = total === 0 ? 0 : Math.round((count / total) * 100);
            progressBar.style.width = percent + '%';
            progressBar.textContent = percent + '%';
        }

        // guarda href original antes de qualquer modificacao
        links.forEach(function(link) {
            link.setAttribute('data-href', link.getAttribute('href'));
        });

        links.forEach(function(link) {
            link.addEventListener('click', function(e) {
                if (link.classList.contains('locked')) {
                    e.preventDefault();
                    return;
                }
                if (link.classList.contains('opened')) {
                    e.preventDefault();
                    return;
                }
                if (link.classList.contains('timer-active')) {
                    e.preventDefault();
                    const url = link.getAttribute('data-href');
                    if (url) window.open(url, '_blank');
                    return;
                }

                e.preventDefault();
                const id = link.getAttribute('data-id');
                const url = link.getAttribute('data-href');

                if (url) window.open(url, '_blank');

                const endTime = Date.now() + TIMER_DURATION * 1000;
                setTimerData(id, endTime);
                startTimerUI(id, endTime);
                setTimeout(function() {
                    completeTimer(id);
                }, TIMER_DURATION * 1000);
            });

            link.addEventListener('dblclick', function(e) {
                if (link.classList.contains('locked')) {
                    e.preventDefault();
                    return;
                }
                if (link.classList.contains('opened')) {
                    const url = link.getAttribute('data-href');
                    if (url) {
                        window.open(url, '_blank');
                    }
                }
            });
        });

        resetBtn.addEventListener('click', function() {
            if (confirm('Tem certeza que deseja limpar todo o progresso?')) {
                sessionStorage.removeItem(STORAGE_KEY);
                sessionStorage.removeItem(TIMERS_KEY);
                for (const id in activeTimers) {
                    clearInterval(activeTimers[id]);
                }
                activeTimers = {};
                document.querySelectorAll('.timer-display').forEach(function(el) {
                    el.remove();
                });
                document.querySelectorAll('.check').forEach(function(el) {
                    el.style.display = '';
                });
                document.querySelectorAll('.timer-active').forEach(function(el) {
                    el.classList.remove('timer-active');
                });
                updateUI();
            }
        });

        // Inicializa
        updateUI();
        initTimers();
    </script>
</body>
</html>
