<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Activity Tracker</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "background": "#f9f9f9",
            "ocean-depth": "#001d35",
            "on-secondary-fixed": "#001b3e",
            "on-tertiary-container": "#41b9fb",
            "surface-container-low": "#f3f3f4",
            "surface": "#f9f9f9",
            "surface-subtle": "#f8f9fb",
            "inverse-surface": "#2f3131",
            "tertiary-fixed-dim": "#87ceff",
            "border-muted": "#e2e8f0",
            "secondary": "#245dac",
            "primary-fixed": "#d1e4ff",
            "on-primary-fixed": "#001d35",
            "primary-fixed-dim": "#9ecafe",
            "secondary-fixed-dim": "#aac7ff",
            "surface-container": "#eeeeee",
            "surface-variant": "#e2e2e2",
            "error-container": "#ffdad6",
            "surface-bright": "#f9f9f9",
            "secondary-container": "#7babff",
            "error": "#ba1a1a",
            "on-tertiary": "#ffffff",
            "on-primary": "#ffffff",
            "on-error": "#ffffff",
            "on-error-container": "#93000a",
            "cyan-accent": "#05d3f8",
            "tertiary": "#003047",
            "inverse-primary": "#9ecafe",
            "primary-container": "#0f4571",
            "surface-container-lowest": "#ffffff",
            "outline-variant": "#c2c7d0",
            "on-tertiary-fixed-variant": "#004c6d",
            "surface-container-highest": "#e2e2e2",
            "on-secondary-container": "#003e81",
            "on-primary-container": "#88b3e5",
            "tertiary-container": "#004767",
            "surface-dim": "#dadada",
            "surface-container-high": "#e8e8e8",
            "secondary-fixed": "#d7e3ff",
            "primary": "#002e51",
            "inverse-on-surface": "#f0f1f1",
            "on-surface": "#1a1c1c",
            "on-secondary-fixed-variant": "#00458e",
            "on-background": "#1a1c1c",
            "on-secondary": "#ffffff",
            "on-primary-fixed-variant": "#164975",
            "surface-tint": "#33618f",
            "on-tertiary-fixed": "#001e2e",
            "on-surface-variant": "#42474f",
            "tertiary-fixed": "#c8e6ff",
            "outline": "#727780"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "gap-md": "16px",
            "margin-mobile": "16px",
            "gutter": "24px",
            "gap-lg": "32px",
            "container-max": "1200px",
            "gap-sm": "8px",
            "base": "8px",
            "margin-lg": "32px"
          },
          "fontFamily": {
            "label-md": ["Plus Jakarta Sans"],
            "label-sm": ["Plus Jakarta Sans"],
            "title-md": ["Plus Jakarta Sans"],
            "display-lg": ["Plus Jakarta Sans"],
            "body-md": ["Plus Jakarta Sans"],
            "headline-lg-mobile": ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"]
          },
          "fontSize": {
            "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
            "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
            "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
            "display-lg": ["48px", {"lineHeight": "60px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
            "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
            "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}]
          }
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .material-fill {
      font-variation-settings: 'FILL' 1, 'wght' 500;
    }
  </style>
</head>

<body class="bg-background min-h-screen text-on-surface">
  <!-- Top App Bar Mobile (Simplified) -->
  <header
    class="bg-surface/90 backdrop-blur-md flex md:hidden items-center px-4 py-3 sticky top-0 z-50 shadow-sm border-b border-border-muted">
    <button class="mr-4 text-on-surface"><span class="material-symbols-outlined">arrow_back</span></button>
    <h1 class="font-title-md text-title-md flex-1 text-center text-on-surface">Activities</h1>
    <div class="w-6"></div> <!-- Spacer for balance -->
  </header>

  <!-- Main Content Canvas -->
  <main class="max-w-[800px] mx-auto px-4 md:px-gutter py-margin-lg">
    <!-- Header Section -->
    <div class="mb-margin-lg text-center md:text-left text-on-surface">
      <h1 id="mainTitle" class="font-display-lg text-display-lg mb-2">Activity Tracker</h1>
      <p id="subtitle" class="font-title-md text-title-md text-on-surface-variant">Track your progress through the activities.</p>
    </div>

    <!-- Progress Card -->
    <div class="bg-surface rounded-xl p-6 shadow-md mb-margin-lg border border-border-muted relative overflow-hidden">
      <!-- Soft decorative glow -->
      <div class="absolute -right-20 -top-20 w-40 h-40 bg-cyan-accent/10 rounded-full blur-3xl pointer-events-none">
      </div>
      <div class="flex justify-between items-center mb-4 relative z-10">
        <h2 id="progressTitle" class="font-title-md text-title-md text-on-surface">Progress</h2>
        <span id="progressBadge" class="font-label-md text-label-md bg-secondary text-white px-3 py-1 rounded-full">0%
          Complete</span>
      </div>
      <!-- Progress Bar -->
      <div
        class="w-full bg-surface-container rounded-full h-3 mb-2 overflow-hidden border border-border-muted relative z-10">
        <div id="progressBar"
          class="bg-gradient-to-r from-[#009ddd] to-[#05d3f8] h-3 rounded-full transition-all duration-500"
          style="width: 0%"></div>
      </div>
      <p id="progressText" class="font-body-md text-body-md text-on-surface-variant text-sm relative z-10">Let's get
        started!</p>
    </div>

    <!-- Exercise List -->
    <div id="linkList" class="grid grid-cols-1 gap-4">
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>

</html>
